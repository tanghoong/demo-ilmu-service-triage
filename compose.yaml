services:
  triage:
    build: .
    image: ilmu-service-triage:latest
    ports:
      # Bind to loopback by default: on a host with a public IP, "8100:8000"
      # would publish the container straight to the internet, past whatever
      # reverse proxy terminates TLS. Set WEB_BIND=0.0.0.0 only when nothing
      # else is fronting this.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8100}:8000"
    environment:
      # The key is read from your shell / .env — never baked into the image.
      # Leave it unset and the service runs its deterministic stub instead.
      ILMU_API_KEY: ${ILMU_API_KEY:-}
      ILMU_BASE_URL: ${ILMU_BASE_URL:-https://api.ilmu.ai/v1}
      ILMU_MODEL: ${ILMU_MODEL:-ilmu-v3.1}
      ILMU_MOCK: ${ILMU_MOCK:-0}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      AUDIT_STORE_CONTENT: ${AUDIT_STORE_CONTENT:-1}
    volumes:
      # Audit log survives container restarts.
      - triage-audit:/srv/data
    restart: unless-stopped

volumes:
  triage-audit:
