<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ILMU Service Triage</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <h1>Service Triage</h1>
        <span class="badge" id="mode">…</span>
        <span class="tagline">Server-side ILMU · BM / EN / 中文 / Manglish · the browser only calls <code>/api</code></span>
      </header>

      <div class="grid">
        <section class="panel compose">
          <div class="row">
            <label>Channel
              <select id="channel">
                <option value="web">web</option>
                <option value="whatsapp">whatsapp</option>
                <option value="email">email</option>
                <option value="phone">phone</option>
              </select>
            </label>
            <label>Tier
              <select id="tier">
                <option value="standard">standard</option>
                <option value="free">free</option>
                <option value="enterprise">enterprise</option>
              </select>
            </label>
            <button id="submit">Triage</button>
          </div>

          <textarea id="message" rows="4" maxlength="4000"
            placeholder="Bil saya bulan ni RM320, tapi biasa RM90 je. Tolong semak, kalau tak saya report kat MCMC."></textarea>

          <div class="samples" id="samples"></div>
        </section>

        <section id="result" class="panel result">
          <p class="hint">Triage a message to see the decision.</p>
        </section>
      </div>

      <section class="panel history-panel">
        <div class="history-head">
          <h2>History <span class="count" id="history-count"></span></h2>
          <div id="stats" class="stats"></div>
          <div class="history-actions">
            <button class="ghost" id="refresh" title="Reload from the server">↻</button>
            <button class="ghost danger" id="clear">Clear</button>
          </div>
        </div>
        <div id="history"></div>
        <div class="pager" id="pager"></div>
        <div id="compare"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
